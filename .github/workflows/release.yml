name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: Publish npm package with provenance
    runs-on: ubuntu-latest
    timeout-minutes: 40

    environment: release

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository with full tag history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Verify tag matches package version
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version v${version}" >&2
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm ci

      - name: Provision exact Python contract source
        shell: bash
        run: |
          set -euo pipefail
          commit="$(node -p "require('./UPSTREAM-PARITY.json').git_commit")"
          git clone --no-checkout --no-single-branch https://github.com/Xerolux/idm-heatpump-api.git ../idm-heatpump-api
          git -C ../idm-heatpump-api checkout --detach "$commit"

      - name: Install Python contract runtime
        run: python -m pip install "../idm-heatpump-api[web]"

      - name: Validate package (format, lint, typecheck, coverage, build, pack)
        run: npm run check

      - name: Verify exact pinned semantic parity
        run: npm run parity:check

      - name: Verify latest stable Python release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pinned="$(node -p "require('./UPSTREAM-PARITY.json').git_tag")"
          latest="$(gh api repos/Xerolux/idm-heatpump-api/releases/latest --jq .tag_name)"
          test "$latest" = "$pinned"

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish
