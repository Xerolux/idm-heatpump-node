name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: Publish npm package with provenance
    runs-on: ubuntu-latest
    timeout-minutes: 40

    environment: release

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository with full tag history
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Verify tag matches package version
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version v${version}" >&2
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm ci

      - name: Provision exact Python contract source
        shell: bash
        run: |
          set -euo pipefail
          commit="$(node -p "require('./UPSTREAM-PARITY.json').git_commit")"
          git clone --no-checkout --no-single-branch https://github.com/Xerolux/idm-heatpump-api.git ../idm-heatpump-api
          git -C ../idm-heatpump-api checkout --detach "$commit"

      - name: Install Python contract runtime
        run: python -m pip install "../idm-heatpump-api[web]"

      - name: Validate package (format, lint, typecheck, coverage, build, pack)
        run: npm run check

      - name: Verify exact pinned semantic parity
        run: npm run parity:check

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish
